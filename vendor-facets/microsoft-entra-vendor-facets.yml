# Vendor facets — Microsoft Entra (External ID, successor to Azure AD B2C). Customer identity with user
# flows and custom URL domains fronted by Azure Front Door. Headline: every discovery document is
# TENANT-SCOPED (https://<custom-url-domain>/<tenant>/v2.0/.well-known/openid-configuration), and the
# harvest probes only host roots, so the served tiers are not reached even on the provider's own domain.
# Microsoft states plainly that Entra publishes no RFC 7591 registration endpoint.
vendor: microsoft-entra
name: Microsoft Entra External ID
website: https://www.microsoft.com/en-us/security/business/identity-access/microsoft-entra-external-id
areas:
- identity
registry_keys:
- azure-ad-b2c
rubric_schema_version: 0.22.0
generated: '2026-09-25'
features_refreshed: '2026-09-25'
basis: capability
summary: >-
  Entra External ID lifts almost nothing on the identity dimensions as the rubric reads them today. Its
  discovery documents live under a tenant path, not at a host root, so a provider using a custom URL domain
  still is not read as serving discovery; it can earn the OpenAPI fallback tiers only by declaring OAuth
  in its own contract. There is no dynamic client registration (Microsoft says so for MCP), and no protected-resource
  metadata. Hosted user flows give a sign-up page the provider can declare.
features:
- id: custom-url-domains
  name: Custom URL domains
  description: >-
    Brands the sign-in endpoints on a verified subdomain (login.contoso.com) routed through an Azure Front
    Door profile the customer runs (Standard or Premium); endpoints keep the /<tenant>/ path prefix.
  source: https://learn.microsoft.com/en-us/entra/external-id/customers/how-to-custom-url-domain
  tier: paid
- id: user-flows
  name: Sign-up and sign-in user flows
  description: >-
    Hosted sign-up/sign-in user flows for external tenants, runnable on the default ciamlogin.com domain
    or the custom URL domain.
  source: https://learn.microsoft.com/en-us/entra/external-id/customers/how-to-custom-url-domain
  tier: all
- id: tenant-discovery
  name: Tenant-scoped OIDC discovery
  description: >-
    v2.0 discovery documents carry a tenant-templated issuer and advertise private_key_jwt and self_signed_tls_client_auth
    client authentication; no registration_endpoint.
  source: https://login.microsoftonline.com/common/v2.0/.well-known/openid-configuration
  tier: all
- id: no-dcr
  name: Static app registration only (no DCR)
  description: >-
    Microsoft documents that Entra ID publishes no RFC 7591 registration endpoint, so MCP clients must
    be registered statically.
  source: >-
    https://learn.microsoft.com/en-us/microsoft-365/copilot/extensibility/plugin-authentication-dynamic-client-registration
  tier: all
maps:
- feature: tenant-discovery
  check: auth_clarity
  layer: agent_readiness
  grade: negotiable
  partial: true
  partial_note: >-
    The served tier reads a root /.well-known/openid-configuration on a provider host; Entra's is under
    /<tenant>/v2.0/, which the root-only harvest never requests. Only the OpenAPI fallback is reachable.
  provider_must: Declare the Entra-backed oauth2 or openIdConnect scheme in its own OpenAPI.
  points: 10
  baseline_pass_rate: 0.474
- feature: tenant-discovery
  check: delegated_identity
  layer: agent_readiness
  grade: documented
  partial: true
  partial_note: >-
    Same tenant-path reason; the documented tier reads an authorizationCode flow or openIdConnect in the
    provider's OpenAPI.
  provider_must: Declare the authorizationCode flow in its own OpenAPI.
  points: 6
  baseline_pass_rate: 0.209
- feature: user-flows
  check: sign_up_present
  layer: composite
  provider_must: Declare the user-flow sign-up URL as a Login or SignUp pointer in apis.yml.
  catalog_pass_rate: 0.19
  facet: access_clarity
  points: 5
  baseline_pass_rate: 0.463
- feature: tenant-discovery
  check: reg_fapi_profile
  layer: composite
  conditional: true
  condition: >-
    Banking/open-finance regime only, and only if the provider's own auth documentation states it uses
    private_key_jwt or certificate-bound client authentication.
  catalog_pass_rate: 0.196
  facet: regulatory
  points: 6
  baseline_pass_rate: 0.463
earns_nothing:
- feature: custom-url-domains
  check: auth_clarity
  why: >-
    A custom URL domain puts discovery on the provider's host but still under /<tenant>/v2.0/, so it reads
    exactly as the ciamlogin.com default does.
- feature: tenant-discovery
  check: well_known_published
  why: openid-configuration is not one of the well-known documents that check reads.
out_of_reach:
  checks:
  - dynamic_client_registration
  - protected_resource_metadata
  - security_schemes_defined
  - oauth_scopes_enumerated
  - consent_identity
  note: >-
    No RFC 7591 endpoint by Microsoft's own statement; RFC 9728 and the OpenAPI checks are the provider's
    resource server and contract.
surface:
  access_clarity:
    reachable: 5.0
    total: 38
  regulatory:
    reachable: 6.0
    total: 108
  agent_readiness:
    reachable: 10.5
    total: 139
hard_rule: >-
  A model, not a score. Adopting this vendor changes a provider's Kin Score only when the provider publishes
  the resulting artifacts on its own surface; nothing here writes a score, and no sponsorship or partnership
  can.
